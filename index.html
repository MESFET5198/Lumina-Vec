<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumina-Vec</title>
<style>body{font:16px system-ui;background:#f3f5fa;color:#182236;margin:0}.wrap{max-width:1050px;margin:32px auto;padding:28px;background:white;border-radius:18px;box-shadow:0 8px 32px #18223618}h1{margin-top:0}label,button{display:block;margin:16px 0 8px}input,select,button{font:inherit;padding:10px;border:1px solid #ccd4e2;border-radius:8px}button{background:#2764e8;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{padding:14px;background:#f7f9fc;border-radius:12px;min-width:0}.card img{width:100%;max-height:70vh;object-fit:contain;background:repeating-conic-gradient(#ddd 0 25%,white 0 50%) 0/16px 16px}.muted{color:#64748b;font-size:14px}progress{width:100%;height:18px}@media(max-width:700px){.wrap{margin:0;padding:16px;border-radius:0}.grid{grid-template-columns:1fr}}</style>
<main class="wrap"><h1>Lumina-Vec</h1><p class="muted">动漫插画转彩色 SVG。大图保持原始输入尺寸；项目预设可能会缩小内部工作分辨率以控制耗时。</p><form id="form"><label>选择图片 <input type="file" name="image" accept="image/png,image/jpeg,image/webp" required></label><label>处理预设 <select name="preset"><option value="auto">自动选择（推荐）</option><option value="shading">Shading · 颗粒较重的平涂图</option><option value="shading-detail">Shading Detail · 厚涂或细节丰富</option><option value="illustration">Illustration · 简化色块</option><option value="detail">Detail · 保留细节</option><option value="flat">Flat · 大色块</option></select></label><button id="go">开始转换</button></form><p id="status">就绪</p><progress id="progress" value="0" max="100"></progress><section id="out" class="grid"></section></main>
<script>const f=document.querySelector('#form'),s=document.querySelector('#status'),p=document.querySelector('#progress'),b=document.querySelector('#go'),out=document.querySelector('#out');f.onsubmit=e=>{e.preventDefault();out.replaceChildren();b.disabled=true;p.value=0;const x=new XMLHttpRequest(),t=Date.now();x.open('POST','/api/process');x.upload.onprogress=e=>{if(e.lengthComputable){p.value=e.loaded/e.total*100;s.textContent=`上传 ${Math.round(p.value)}%`}};x.onload=()=>{if(x.status>=400){s.textContent=JSON.parse(x.responseText).error;b.disabled=false;return}const {job}=JSON.parse(x.responseText);s.textContent='服务器处理中…';const timer=setInterval(async()=>{try{const r=await fetch('/api/status/'+job).then(r=>r.json());s.textContent=`${r.status==='done'?'完成':r.status==='error'?'失败':'处理中'} · ${Math.round((Date.now()-t)/1000)} 秒`;if(r.status==='done'){clearInterval(timer);p.value=100;s.textContent=`完成 · ${r.preset} · ${r.width}×${r.height} · ${r.paths} 条路径 · ${(r.bytes/1048576).toFixed(2)} MB · ${r.seconds} 秒`;for(const [title,url,download] of [['PNG 预览',r.png,false],['SVG 成品',r.svg,true]]){const d=document.createElement('article');d.className='card';const h=document.createElement('h3');h.textContent=title;d.append(h);if(!download){const im=document.createElement('img');im.src=url;d.append(im)}const a=document.createElement('a');a.href=url+(download?'?download=1':'');a.download='';a.textContent='下载 '+title;d.append(a);out.append(d)}b.disabled=false}else if(r.status==='error'){clearInterval(timer);s.textContent='处理失败：'+r.error;b.disabled=false}}catch{}} ,1000)};x.onerror=()=>{s.textContent='连接失败';b.disabled=false};x.send(new FormData(f))};</script></html>
